plugins {
    id "maven-publish"
    id "org.jetbrains.kotlin.jvm" version "1.5.31"
    id "com.github.johnrengelman.shadow" version "5.2.0"
}

group "gg.scala"
version "1.0-SNAPSHOT"

repositories {
    mavenLocal()
    mavenCentral()

    maven { url 'https://repo.lucko.me' }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.5.31'
    compileOnly "me.lucko:helper:5.6.8"

    compileOnly "io.papermc:paperlib:1.0.6"
    compileOnly fileTree(dir: "lib")

    compileOnly "com.github.mkotb:ConfigAPI:e1c8df3f13"
    compileOnly "org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT"
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "1.8"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    archiveFileName = "uhc.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }
}

tasks.build.dependsOn(shadowJar, publishing)
